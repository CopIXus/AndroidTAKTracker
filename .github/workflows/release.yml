name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Package APK + SHA256
        run: |
          TAG="build-0.1.${{ github.run_number }}"
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$SRC" dist/AndroidTAKTracker.apk
          (cd dist && sha256sum AndroidTAKTracker.apk | awk '{print $1 "  AndroidTAKTracker.apk"}' > AndroidTAKTracker.apk.sha256)
          echo "Packaged $TAG"
          cat dist/AndroidTAKTracker.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidTAKTracker-release
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-0.1.${{ github.run_number }}
          name: build-0.1.${{ github.run_number }}
          files: |
            dist/AndroidTAKTracker.apk
            dist/AndroidTAKTracker.apk.sha256
          generate_release_notes: true
          body: |
            Continuous build of AndroidTAKTracker.

            Install `AndroidTAKTracker.apk`. Verify with `AndroidTAKTracker.apk.sha256`.
            MDM-managed fleets should prefer MDM app updates over the in-app updater.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
